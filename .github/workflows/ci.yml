name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Every PR: lint, typecheck, unit + contract tests, contract drift check.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      - name: OpenAPI contract — generated types must be up to date
        run: |
          pnpm contract:generate
          git diff --exit-code -- packages/shared-types/src/generated \
            || (echo "::error::Generated contract types are stale. Run 'pnpm contract:generate' and commit." && exit 1)

      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck

      # scoring-engine enforces 100% branch/line/function/statement coverage
      # via vitest thresholds; the job fails below that.
      - name: Unit + contract tests
        run: pnpm test

      - name: Upload scoring-engine coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoring-engine-coverage
          path: packages/scoring-engine/coverage

  # ---------------------------------------------------------------------------
  # Every PR: build each image and scan it. A CRITICAL CVE fails the build.
  # ---------------------------------------------------------------------------
  images:
    name: Image · ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: gateway, dockerfile: services/gateway/Dockerfile }
          - { image: checkin-service, dockerfile: services/checkin-service/Dockerfile }
          - { image: distress-trend-service, dockerfile: services/distress-trend-service/Dockerfile }
          - { image: alert-service, dockerfile: services/alert-service/Dockerfile }
          - { image: reminder-service, dockerfile: services/reminder-service/Dockerfile }
          - { image: case-integration-service, dockerfile: services/case-integration-service/Dockerfile }
          - { image: dev-idp, dockerfile: services/dev-idp/Dockerfile }
          - { image: pwa, dockerfile: apps/pwa/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: vigil/${{ matrix.image }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy — fail on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vigil/${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy — full SARIF report
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vigil/${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: '0'

      - name: Upload SARIF
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # ---------------------------------------------------------------------------
  # On merge to main: the whole system, end to end, in Docker.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (docker compose + Playwright)
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm secrets:dev
      - name: Bring the stack up (health-gated)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: API smoke test through the gateway (TLS 1.3)
        run: NODE_EXTRA_CA_CERTS=secrets/tls_cert.pem node scripts/smoke.mjs
      - run: pnpm --filter @vigil/pwa exec playwright install --with-deps chromium
      - name: Playwright (incl. offline + axe WCAG 2.1 AA)
        run: pnpm e2e
        env:
          CI: 'true'
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            apps/pwa/playwright-report
            compose-logs.txt
      - if: always()
        run: docker compose down -v
