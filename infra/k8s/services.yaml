# The five backend services. Each owns its own database (vigil-db secret keys:
# checkin, trend, alerts, reminders, cases) and is reachable only from the
# gateway and its peers (see network-policies.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkin-service
  labels: { app: checkin-service, tier: service }
spec:
  replicas: 2
  selector: { matchLabels: { app: checkin-service } }
  template:
    metadata:
      labels: { app: checkin-service, tier: service }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: checkin-service
          image: vigil/checkin-service
          ports: [{ containerPort: 3000 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: checkin-service }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: vigil-db, key: checkin } }
            - { name: ALERT_SERVICE_URL, value: "http://alert-service:3000" }
            - { name: TREND_SERVICE_URL, value: "http://distress-trend-service:3000" }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: { configMapKeyRef: { name: vigil-observability, key: otlpEndpoint, optional: true } }
            - name: SENTRY_DSN
              valueFrom: { secretKeyRef: { name: vigil-observability, key: sentryDsn, optional: true } }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
          readinessProbe: { httpGet: { path: /readyz, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 3000 }, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          projected:
            sources:
              - secret: { name: vigil-internal, items: [{ key: token, path: internal_token }] }
              - secret: { name: vigil-field-key, items: [{ key: key, path: field_encryption_key }] }
---
apiVersion: v1
kind: Service
metadata: { name: checkin-service, labels: { app: checkin-service, tier: service } }
spec:
  selector: { app: checkin-service }
  ports: [{ port: 3000, targetPort: 3000 }]
---
