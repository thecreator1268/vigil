# Production mode for Docker Compose (single-host deployments). SAME images
# as dev — only orchestration changes:
#
#   docker compose -f compose.yaml -f infra/compose.prod.yml --profile production up -d
#
#  - resource limits + replica counts on every service
#  - read-only root filesystems, all capabilities dropped, no-new-privileges
#  - no host ports on the gateway/PWA; Caddy (TLS) is the only entry point
#  - the dev-idp is not started and the gateway no longer points at it:
#    configure JWT_ISSUER / JWT_AUDIENCE / jwt_public_key for your real IdP.

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: always

services:
  gateway:
    <<: *hardened
    ports: !reset []
    depends_on: !override
      checkin-service: { condition: service_healthy }
      distress-trend-service: { condition: service_healthy }
      alert-service: { condition: service_healthy }
      reminder-service: { condition: service_healthy }
      case-integration-service: { condition: service_healthy }
      counselor-identity-service: { condition: service_healthy }
    environment:
      DEV_IDP_URL: ""
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER to your OIDC issuer}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vigil-api}
      NODE_ENV: production
      # pwa (always the immediate hop) AND ingress (appears as the next
      # entry in X-Forwarded-For, appended by pwa's own proxy) — both are
      # pinned static addresses below, not a subnet. See
      # docs/design/counselor-passkey-login.md §5 (review point 1).
      TRUSTED_PROXY_ADDRESSES: "172.28.0.10,172.28.0.20"
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 256M }
        reservations: { cpus: "0.1", memory: 128M }

  checkin-service:
    <<: *hardened
    deploy: { replicas: 2, resources: { limits: { cpus: "1.0", memory: 256M } } }
  distress-trend-service:
    <<: *hardened
    deploy: { replicas: 2, resources: { limits: { cpus: "1.0", memory: 256M } } }
  alert-service:
    <<: *hardened
    deploy: { replicas: 2, resources: { limits: { cpus: "0.5", memory: 256M } } }
  reminder-service:
    <<: *hardened
    deploy: { replicas: 1, resources: { limits: { cpus: "0.5", memory: 192M } } }
  case-integration-service:
    <<: *hardened
    environment:
      CASE_SYNC_MOCK: "false"
    deploy: { replicas: 1, resources: { limits: { cpus: "0.5", memory: 192M } } }

  counselor-identity-service:
    <<: *hardened
    environment:
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER to your OIDC issuer}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vigil-api}
      # Changing either of these after counselors have enrolled invalidates
      # every passkey — see docs/design/counselor-passkey-login.md §2/§7.
      PASSKEY_RP_ID: ${VIGIL_DOMAIN:?set VIGIL_DOMAIN}
      PASSKEY_ORIGIN: https://${VIGIL_DOMAIN:?set VIGIL_DOMAIN}
    deploy: { replicas: 2, resources: { limits: { cpus: "0.5", memory: 256M } } }

  pwa:
    <<: *hardened
    ports: !reset []
    deploy: { replicas: 2, resources: { limits: { cpus: "0.5", memory: 128M } } }

  postgres:
    deploy: { resources: { limits: { cpus: "2.0", memory: 1G } } }

  # Never in production.
  dev-idp:
    profiles: [dev-only]

  ingress:
    image: caddy:2.10-alpine
    profiles: [production]
    restart: always
    ports: ["80:80", "443:443"]
    # Pinned: this address is what the gateway trusts as the OUTER hop in
    # X-Forwarded-For (TRUSTED_PROXY_ADDRESSES on gateway, above).
    networks: { edge: { ipv4_address: 172.28.0.20 } }
    depends_on:
      pwa: { condition: service_healthy }
    environment:
      VIGIL_DOMAIN: ${VIGIL_DOMAIN:-localhost}
    volumes:
      # override-file paths resolve against the BASE compose file (repo root)
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }

volumes:
  caddy_data:
